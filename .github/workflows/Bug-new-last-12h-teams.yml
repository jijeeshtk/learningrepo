name: Bug New (Last 12h) Report

on:
  schedule:
    - cron: "0 */12 * * *"      # every hour
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ vars.JIRA_VCS_BUG_OPEN_ALERT_TEAM_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Jira report script (posts to Teams)
        env:
          JIRA_USER: ${{ vars.JIRA_VCS_API_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_VCS_API_TOKEN }}
        run: |
          python Bug-new-last-12h-teams.py
