name: Bug Updated Report

on:
  schedule:
    - cron: "0 */1 * * *" # every hour at minute 0
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest
    env:
      # Use SECRETS for sensitive values
      TEAMS_WEBHOOK_URL: ${{ secrets.JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL }}
      JIRA_VCS_API_EMAIL: ${{ vars.JIRA_VCS_API_EMAIL }}
      JIRA_VCS_API_TOKEN: ${{ secrets.JIRA_VCS_API_TOKEN }}
      # Optional overrides
      JIRA_URL: https://atos-global.atlassian.net
      LOOKBACK_HOURS: "48"
      BATCH_SIZE: "15"
      # JQL: 'project = VCS AND type IN (Bug, Defect) AND updated >= -48h' # uncomment to override
      # DRY_RUN: "1"  # uncomment for testing without posting

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install requests

      - name: Run Jira → Teams report
        run: |
          python scripts/jira_bug_updates_to_teams.py

      # Optional: Upload the JSON for auditing
      - name: Upload jira.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-bug-updated-report
          path: jira.json
          retention-days: 3
``
