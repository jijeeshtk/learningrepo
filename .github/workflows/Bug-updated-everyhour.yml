name: Bug Updated Report

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      # Your placement: EMAIL + WEBHOOK in Variables; TOKEN in Secrets
      JIRA_VCS_API_EMAIL: ${{ vars.JIRA_VCS_API_EMAIL }}
      JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL: ${{ vars.JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL }}
      JIRA_VCS_API_TOKEN: ${{ secrets.JIRA_VCS_API_TOKEN }}

      # Optional
      JIRA_URL: "https://atos-global.atlassian.net"
      LOOKBACK_HOURS: "48"
      BATCH_SIZE: "15"
      # To override JQL, keep it quoted and use plain >= :
      # JQL: "project = VCS AND type IN (Bug, Defect) AND updated >= -48h"
      # DRY_RUN: "1"
      # DEBUG: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Optional but helpful: verify and mask env heads
      - name: Verify required envs are set (masked)
        run: |
          set -euo pipefail
          for v in JIRA_VCS_API_EMAIL JIRA_VCS_API_TOKEN JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL; do
            if [ -z "${!v:-}" ]; then
              echo "Missing env: $v"
              exit 1
            fi
            echo "$v present"
          done

      # In case HTML entities ever sneak into the file, sanitize before run
      - name: Sanitize script if HTML entities present
        run: |
          sed -i 's/&gt;/>/g; s/&lt;/</g' Bug-updated-everyhour.py

      - name: Run Jira → Teams report
        run: |
          python Bug-updated-everyhour.py

      - name: Upload jira.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-bug-updated-report
          path: jira.json
          retention-days: 3
