name: Bug Updated Report

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL: ${{ vars.JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script (prints JSON)
        env:
          JIRA_VCS_API_EMAIL: ${{ vars.JIRA_VCS_API_EMAIL }}
          JIRA_VCS_API_TOKEN: ${{ secrets.JIRA_VCS_API_TOKEN }}
        run: python Bug-updated-everyhour.py > jira.json

      - name: Send issues to Teams in batches of 15
        if: env.JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL != ''
        shell: bash
        run: |
          jq '.issues' jira.json > /tmp/issues.json
          TOTAL=$(jq 'length' /tmp/issues.json)
          BATCH_SIZE=15
          TOTAL_BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))

          index=0
          batch=1

          while [ "$index" -lt "$TOTAL" ]; do
            end=$(( index + BATCH_SIZE ))
            if [ "$end" -gt "$TOTAL" ]; then end="$TOTAL"; fi

            jq ".[$index:$end]" /tmp/issues.json > /tmp/issues_batch.json
            jq -n --slurpfile s /tmp/issues_batch.json '{ issues: $s[0] }' > /tmp/batch.json
            jq '.' /tmp/batch.json > /tmp/pretty.json

            jq -n \
              --arg header "Batch $batch/$TOTAL_BATCHES (items $((index+1))..$end)" \
              --rawfile body /tmp/pretty.json \
              '{ text: ($header + "\n```json\n" + $body + "\n```") }' \
              > /tmp/payload.json

            curl -sS -H "Content-Type: application/json" \
                 -d @/tmp/payload.json \
                 "$TEAMS_WEBHOOK_URL"

            sleep 2
            index=$end
            batch=$(( batch + 1 ))
          done

          echo "All batches sent successfully."
