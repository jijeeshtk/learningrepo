name: Bug Updated Report

on:
  schedule:
    - cron: "0 */1 * * *"    # every hour at minute 0
  workflow_dispatch:

# Least-privilege & single-run protection
permissions:
  contents: read

concurrency:
  group: bug-updated-report
  cancel-in-progress: false

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      # Variables (email + webhook) and Secrets (token)
      JIRA_VCS_API_EMAIL: ${{ vars.JIRA_VCS_API_EMAIL }}
      JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL: ${{ vars.JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL }}
      JIRA_VCS_API_TOKEN: ${{ secrets.JIRA_VCS_API_TOKEN }}

      # Optional knobs
      JIRA_URL: "https://atos-global.atlassian.net"
      LOOKBACK_HOURS: "48"
      BATCH_SIZE: "15"
      # Keep quoted if you override and always use plain >= :
      # JQL: "project = VCS AND type IN (Bug, Defect) AND updated >= -48h"
      # DRY_RUN: "1"
      DEBUG: "1"  # enable structured debug logs by default for now
      TEAMS_MODE: "text"  # "text" | "card" (Adaptive Card)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-requests-2.31
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "requests==2.31.0" "urllib3<2.2"  # stable combo for GH runners

      # Prove envs are present (masked)
      - name: Verify required envs are set (masked)
        run: |
          set -euo pipefail
          for v in JIRA_VCS_API_EMAIL JIRA_VCS_API_TOKEN JIRA_VCS_BUG_CLOSE_ALERT_TEAM_URL; do
            if [ -z "${!v:-}" ]; then
              echo "Missing env: $v"
              exit 1
            fi
            echo "$v present"
          done

      # Defensive: normalize any HTML entities that may be in the file
      - name: Sanitize script if HTML entities present
        run: |
          sed -i 's/&amp;gt;/>/g; s/&amp;lt;/</g; s/&gt;/>/g; s/&lt;/</g' Bug-updated-everyhour.py

      - name: Run Jira → Teams report
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          set -euo pipefail
          python Bug-updated-everyhour.py

      # Keep JSON as artifact for auditing
      - name: Upload jira.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-bug-updated-report
          path: jira.json
          retention-days: 7
