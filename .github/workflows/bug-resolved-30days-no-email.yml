name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  jira-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Send JSON to Teams (plain text)
        shell: bash
        run: |
          # Fix invalid JSON like "Sprint":,
          sed -i 's/":,/"":/g' jira_report.json

          # Validate JSON, fallback if invalid
          if jq empty jira_report.json 2>/dev/null; then
            SAFE_JSON=$(jq -c '.' jira_report.json)
          else
            SAFE_JSON='{"error":"invalid json"}'
          fi

          # Wrap inside Teams-compatible code block
          WRAPPED="```json
$SAFE_JSON
```"

          # If Teams size limit hit (~25k), fallback to minified version
          SIZE=$(echo -n "$WRAPPED" | wc -c)
          if [ "$SIZE" -gt 25000 ]; then
            SAFE_JSON=$(jq -c '.' jira_report.json)
            WRAPPED="$SAFE_JSON"
          fi

          # Build payload
          PAYLOAD=$(jq -n --arg text "$WRAPPED" '{text: $text}')

          # Send to Teams webhook
          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
