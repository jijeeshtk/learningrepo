name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual trigger

jobs:
  jira-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests jq

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Send Plain JSON to Teams (minified)
        shell: bash
        run: |
          # Minify JSON so Teams accepts it (removes pretty-print spacing)
          MINIFIED=$(jq -c '.' jira_report.json)

          # Escape double quotes to avoid breaking JSON payload
          ESCAPED=$(printf '%s' "$MINIFIED" | sed 's/"/\\"/g')

          # Send plain text JSON to Teams
          curl -H "Content-Type: application/json" \
               -d "{\"text\": \"${ESCAPED}\"}" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
