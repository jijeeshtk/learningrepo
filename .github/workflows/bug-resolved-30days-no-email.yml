name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # allow pushing commits
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Fix invalid JSON (convert null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      # Commit JSON into /reports
      - name: Commit JSON into /reports (timestamp + latest)
        env:
          TZ: UTC
        run: |
          set -e
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json "reports/jira_report_${TS}.json"
          cp jira_report.json "reports/jira_report_latest.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Jira report: ${TS}"
            git push
          fi

      # Send JSON to Teams in CHUNKS
      - name: Send chunked JSON to Teams
        if: env.TEAMS_WEBHOOK_URL != ''
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL not set; skipping Teams send."
            exit 0
          fi

          echo "Compacting JSON..."
          jq -c '.' jira_report.json > compact.json

          echo "Splitting JSON into 25KB chunks..."
          split -b 25000 compact.json chunk_

          CHUNK_COUNT=$(ls chunk_* | wc -l)
          echo "Total chunks: $CHUNK_COUNT"

          i=1
          for chunk in chunk_*; do
            CONTENT=$(cat "$chunk")

            echo "Sending CHUNK $i of $CHUNK_COUNT to Teams..."

            jq -n \
              --arg marker "GITHUB_JIRA_REPORT" \
              --arg part "$i" \
              --arg total "$CHUNK_COUNT" \
              --arg data "$CONTENT" \
              '{text: ($marker + "\nCHUNK " + $part + "/" + $total + "\n" + $data)}' \
              > payload.json

            curl -H "Content-Type: application/json" \
                 -d @payload.json \
                 "$TEAMS_WEBHOOK_URL"

            i=$((i+1))
          done

          echo "All chunks successfully sent to Teams!"
