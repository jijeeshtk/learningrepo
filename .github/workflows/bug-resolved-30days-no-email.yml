name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # allow pushing commits
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Fix invalid JSON (convert null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      # --- Commit JSON into /reports for archival ---
      - name: Commit JSON into /reports (timestamp + latest)
        env:
          TZ: UTC
        run: |
          set -e
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json "reports/jira_report_${TS}.json"
          cp jira_report.json "reports/jira_report_latest.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Jira report: ${TS}"
            git push
          fi

      # --- Send JSON to Teams in batches of 20 issues ---
      - name: Send issues to Teams in batches
        if: env.TEAMS_WEBHOOK_URL != ''
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL not set; skipping Teams send."
            exit 0
          fi

          echo "Extracting issues..."
          jq '.issues' jira_report.json > issues.json

          ISSUE_COUNT=$(jq 'length' issues.json)
          echo "Total issues: $ISSUE_COUNT"

          BATCH_SIZE=20
          TOTAL_BATCHES=$(( (ISSUE_COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "Total batches: $TOTAL_BATCHES"

          for ((i=0; i<ISSUE_COUNT; i+=BATCH_SIZE)); do
            START=$i
            END=$((i + BATCH_SIZE))
            BATCH_NUMBER=$(( (i / BATCH_SIZE) + 1 ))

            echo "Preparing batch $BATCH_NUMBER of $TOTAL_BATCHES (issues $START to $END)"

            # Extract slice of issues
            jq ".[$START:$END]" issues.json > issues_batch.json

            # Build clean JSON payload per batch
            jq -n \
              --arg marker "GITHUB_JIRA_REPORT" \
              --arg batch "$BATCH_NUMBER" \
              --arg total "$TOTAL_BATCHES" \
              --slurpfile items issues_batch.json \
              '{
                batch: ($batch | tonumber),
                total_batches: ($total | tonumber),
                issues: $items[0]
              }' > batch_payload.json

            echo "Sending batch $BATCH_NUMBER to Teams..."

            jq -n \
              --rawfile body batch_payload.json \
              '{text: $body}' \
              > teams_payload.json

            curl -H "Content-Type: application/json" \
                 -d @teams_payload.json \
                 "$TEAMS_WEBHOOK_URL"
          done

          echo "All Teams batches sent successfully!"
