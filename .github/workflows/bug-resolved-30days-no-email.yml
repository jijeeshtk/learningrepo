name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      # default batch size; can override via Actions variable
      BATCH_SIZE: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Normalize JSON (null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      - name: Commit JSON into /reports (audit)
        env:
          TZ: UTC
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json "reports/jira_report_${TS}.json"
          cp jira_report.json "reports/jira_report_latest.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json
          git commit -m "Jira report: ${TS}" || true
          git push || true

      - name: Send issues to Teams (batch by count + auto size split + code block)
        if: env.TEAMS_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set; skipping Teams send."
            exit 0
          fi

          # Extract issues array from full JSON
          jq '.issues' jira_report.json > issues.json
          COUNT=$(jq 'length' issues.json)
          BATCH_SIZE="${BATCH_SIZE:-20}"

          echo "Total issues: $COUNT"
          echo "Target batch size: $BATCH_SIZE"

          # Safety ceiling for webhook payload body (bytes) to avoid Teams truncation or rejection.
          # We keep it conservative to account for overhead.
          MAX_BYTES=27000

          send_range() {
            local start="$1"
            local end="$2"      # exclusive
            local label="$3"    # label for context/logging

            local cnt=$(( end - start ))

            # Slice issues and build EXACT JSON structure: { "issues": [...] }
            jq ".[$start:$end]" issues.json > issues_slice.json
            jq -n --slurpfile items issues_slice.json '{ issues: $items[0] }' > final_batch.json

            # Pretty print (same as your working single-batch step)
            jq '.' final_batch.json > pretty_batch.json

            # Build Teams payload with a code block, using jq to avoid YAML/heredoc issues
            jq -n \
              --arg header "$label (issues $((start+1))..$end, count=$cnt)" \
              --rawfile body pretty_batch.json \
              '{ text: ($header + "\n" + "```" + "\n" + $body + "\n" + "```") }' > teams_payload.json

            # If payload too large, split this range into two and send recursively
            local size
            size=$(wc -c < teams_payload.json | tr -d ' ')
            if [ "$size" -gt "$MAX_BYTES" ] && [ "$cnt" -gt 1 ]; then
              local mid=$(( start + (cnt/2) ))
              echo "Payload too large (${size}B). Splitting $label into [$((start+1))..$mid] and [$((mid+1))..$end] ..."
              send_range "$start" "$mid" "$label-A"
              send_range "$mid" "$end" "$label-B"
              return
            fi

            # Send with simple retry/backoff; keep going even if one sub-send fails
            for attempt in 1 2 3; do
              http=$(curl -s -o /tmp/teams_resp.txt -w "%{http_code}" \
                -H "Content-Type: application/json" \
                -d @teams_payload.json \
                "$TEAMS_WEBHOOK_URL" || true)

              if [ "$http" -ge 200 ] && [ "$http" -lt 300 ]; then
                echo "Delivered: $label (HTTP $http, ${size}B)"
                return 0
              fi

              echo "WARN: Send failed for $label (HTTP $http). Attempt $attempt/3"
              if [ "$http" = "429" ] || [ "$http" = "413" ]; then
                # If throttled (429) or too large (413), split if possible
                if [ "$cnt" -gt 1 ]; then
                  local mid=$(( start + (cnt/2) ))
                  echo "Splitting on failure ($http): $label → [$((start+1))..$mid] and [$((mid+1))..$end]"
                  send_range "$start" "$mid" "$label-A"
                  send_range "$mid" "$end" "$label-B"
                  return 0
                fi
              fi
              sleep $(( attempt * 2 ))
            done

            echo "ERROR: Failed to deliver $label after retries. HTTP=$(cat /tmp/teams_resp.txt)"
            return 1
          }

          if [ "$COUNT" -eq 0 ]; then
            echo "No issues to send."
            exit 0
          fi

          # Primary batching by fixed issue count, with auto-split if any batch is too large
          total_batches=$(( (COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))
          b=1
          idx=0
          while [ "$idx" -lt "$COUNT" ]; do
            end=$(( idx + BATCH_SIZE ))
            if [ "$end" -gt "$COUNT" ]; then end="$COUNT"; fi
            label="Batch $b/$total_batches"
            echo "Preparing $label (issues $((idx+1))..$end)"
            # send_range may split internally if payload exceeds size
            send_range "$idx" "$end" "$label" || true
            idx="$end"
            b=$(( b + 1 ))
          done

          echo "All batches attempted."
