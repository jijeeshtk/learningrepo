name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Normalize JSON (null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      - name: Commit JSON for audit
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json reports/jira_report_${TS}.json
          cp jira_report.json reports/jira_report_latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json
          git commit -m "Jira report updated ${TS}" || true
          git push || true

      - name: Send issues to Teams in batches (fixed)
        if: env.TEAMS_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          BATCH_SIZE=20

          jq '.issues' jira_report.json > /tmp/issues.json
          TOTAL=$(jq 'length' /tmp/issues.json)

          echo "Total issues=${TOTAL}"

          if [ "$TOTAL" -eq 0 ]; then
            echo "No issues to send."
            exit 0
          fi

          # Send batches of 20 issues each
          start=0
          batch=1
          total_batches=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))

          while [ "$start" -lt "$TOTAL" ]; do
            end=$(( start + BATCH_SIZE ))
            if [ "$end" -gt "$TOTAL" ]; then
              end="$TOTAL"
            fi

            echo "Preparing Batch $batch/$total_batches (items $((start+1))..$end)"

            # Create batch JSON: { "issues": [...] }
            jq ".[$start:$end]" /tmp/issues.json > /tmp/slice.json
            jq -n --slurpfile s /tmp/slice.json '{ issues: $s[0] }' > /tmp/batch.json

            # Pretty print (exactly like your working single-batch step)
            jq '.' /tmp/batch.json > /tmp/pretty.json

            # Add header BEFORE code block (this is what makes Batch 1 always render)
            jq -n \
              --arg header "Batch $batch/$total_batches" \
              --rawfile body /tmp/pretty.json \
              '{text: ($header + "\n```json\n" + $body + "\n```")}' \
              > /tmp/payload.json

            echo "Sending Batch $batch/$total_batches"
            curl -sS -H "Content-Type: application/json" \
                 -d @/tmp/payload.json \
                 "$TEAMS_WEBHOOK_URL"

            sleep 1
            start="$end"
            batch=$(( batch + 1 ))
          done

          echo "All batches sent."
