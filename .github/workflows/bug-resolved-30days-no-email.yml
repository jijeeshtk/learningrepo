name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      # You can override this in repo/Org variables without editing YAML
      BATCH_SIZE: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Normalize JSON (null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      - name: Commit JSON into /reports (audit)
        env:
          TZ: UTC
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json "reports/jira_report_${TS}.json"
          cp jira_report.json "reports/jira_report_latest.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json
          git commit -m "Jira report: ${TS}" || true
          git push || true

      - name: Send issues to Teams (batch by count + auto size split + code block)
        if: env.TEAMS_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set; skipping Teams send."
            exit 0
          fi

          # Extract issues array from full JSON
          jq '.issues' jira_report.json > issues.json
          COUNT=$(jq 'length' issues.json)
          BASE_BATCH="${BATCH_SIZE:-20}"

          echo "Total issues: $COUNT"
          echo "Base batch size: $BASE_BATCH"

          # Conservative ceiling in bytes for the webhook body to ensure Teams renders it.
          # We keep room for code fences/header and webhook overhead.
          MAX_BYTES=24000

          # Build and measure payload. If too big, caller will shrink count and try again.
          build_payload() {
            # Args: start end label pretty(1|0)
            local start="$1" end="$2" label="$3" pretty="$4"

            jq ".[$start:$end]" issues.json > /tmp/issues_slice.json
            jq -n --slurpfile items /tmp/issues_slice.json '{ issues: $items[0] }' > /tmp/batch.json

            if [ "$pretty" = "1" ]; then
              jq '.' /tmp/batch.json > /tmp/body.json
            else
              jq -c '.' /tmp/batch.json > /tmp/body.json
            fi

            # Build Teams payload with code block (same style as your single-batch)
            jq -n \
              --arg header "$label (issues $((start+1))..$end, count=$((end-start)))" \
              --rawfile body /tmp/body.json \
              '{ text: ($header + "\n" + "```" + "\n" + $body + "\n" + "```") }' > /tmp/teams_payload.json
          }

          # Send with small retry/backoff
          send_payload() {
            local label="$1"
            local size
            size=$(wc -c < /tmp/teams_payload.json | tr -d ' ')
            for attempt in 1 2 3; do
              http=$(curl -s -o /tmp/teams_resp.txt -w "%{http_code}" \
                -H "Content-Type: application/json" \
                -d @/tmp/teams_payload.json \
                "$TEAMS_WEBHOOK_URL" || true)

              if [ "$http" -ge 200 ] && [ "$http" -lt 300 ]; then
                echo "Delivered: $label (HTTP $http, ${size}B)"
                return 0
              fi
              echo "WARN: Send failed for $label (HTTP $http). Attempt $attempt/3"
              sleep $((attempt * 2))
            done
            echo "ERROR: Failed to deliver $label after retries. Last HTTP: $http; Body:"
            cat /tmp/teams_resp.txt || true
            return 1
          }

          # Try to send a range; if too big, shrink by halving until it fits.
          # If a single-issue pretty payload is still too big, fallback to compact.
          send_range_with_shrink() {
            local start="$1" end="$2" label="$3"
            local cnt=$(( end - start ))
            local local_size="$cnt"

            while true; do
              # 1) Build pretty JSON payload
              build_payload "$start" "$end" "$label" 1
              local size
              size=$(wc -c < /tmp/teams_payload.json | tr -d ' ')

              if [ "$size" -le "$MAX_BYTES" ]; then
                send_payload "$label" && return 0 || return 1
              fi

              # 2) If pretty too big:
              if [ "$cnt" -gt 1 ]; then
                # shrink by half and try again
                local mid=$(( start + (cnt/2) ))
                echo "Payload too large (${size}B). Splitting $label into [$((start+1))..$mid] and [$((mid+1))..$end] ..."
                send_range_with_shrink "$start" "$mid"  "$label-A" || true
                send_range_with_shrink "$mid"   "$end"  "$label-B" || true
                return 0
              else
                # cnt == 1: fallback to COMPACT JSON for this single issue
                echo "Single-issue payload too large in pretty form (${size}B). Falling back to COMPACT for $label."
                build_payload "$start" "$end" "$label" 0
                size=$(wc -c < /tmp/teams_payload.json | tr -d ' ')
                if [ "$size" -le "$MAX_BYTES" ]; then
                  send_payload "$label" || true
                  return 0
                else
                  echo "ERROR: Single issue still exceeds size after compact (${size}B). Truncating text as a last resort."
                  # last resort: send a tiny notice instead of losing the batch
                  jq -n --arg txt "$label: payload exceeded size. Please check the artifact/reports in repo." '{ text: $txt }' > /tmp/teams_payload.json
                  send_payload "$label (truncated)" || true
                  return 0
                fi
              fi
            done
          }

          if [ "$COUNT" -eq 0 ]; then
            echo "No issues to send."
            exit 0
          fi

          # Main loop: send in base batches; any batch too big will be auto‑split
          total_batches=$(( (COUNT + BASE_BATCH - 1) / BASE_BATCH ))
          idx=0
          b=1
          while [ "$idx" -lt "$COUNT" ]; do
            end=$(( idx + BASE_BATCH ))
            if [ "$end" -gt "$COUNT" ]; then end="$COUNT"; fi

            label="Batch $b/$total_batches"
            echo "Preparing $label (issues $((idx+1))..$end)"
            send_range_with_shrink "$idx" "$end" "$label" || true

            # small delay to reduce chance of throttling
            sleep 1

            idx="$end"
            b=$(( b + 1 ))
          done

          echo "All batches attempted."
