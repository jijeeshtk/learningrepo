name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Fix invalid JSON
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      - name: Commit JSON into reports
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json reports/jira_report_${TS}.json
          cp jira_report.json reports/jira_report_latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json
          git commit -m "Jira report: ${TS}" || true
          git push || true

      - name: Send issues to Teams in batches (20 per message)
        if: env.TEAMS_WEBHOOK_URL != ''
        run: |
          echo "Extracting issues..."
          jq '.issues' jira_report.json > issues.json

          COUNT=$(jq 'length' issues.json)
          BATCH_SIZE=20
          TOTAL=$(( (COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))

          echo "Total issues: $COUNT"
          echo "Total batches: $TOTAL"

          index=0
          while [ $index -lt $COUNT ]; do
            END=$((index + BATCH_SIZE))
            BATCH=$(( (index / BATCH_SIZE) + 1 ))

            jq ".[$index:$END]" issues.json > issues_batch.json

            jq -n --slurpfile x issues_batch.json \
              '{ issues: $x[0] }' > final_batch.json

            ESCAPED=$(jq -Rs '.' final_batch.json)

            printf '{ "text": %s }\n' "$ESCAPED" > teams_payload.json

            echo "Sending batch $BATCH of $TOTAL"
            curl -H "Content-Type: application/json" \
                 -d @teams_payload.json \
                 "$TEAMS_WEBHOOK_URL"

            index=$((index + BATCH_SIZE))
          done

          echo "All batches sent successfully!"
