name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # allow pushing commits
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Fix invalid JSON (convert null → "")
        run: |
          # Replace all nulls anywhere in the document with empty strings.
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      # --- Commit JSON into the repository so Power Automate GitHub connector can trigger ---
      - name: Commit JSON into /reports (timestamp + latest)
        env:
          TZ: UTC
        run: |
          set -e
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json "reports/jira_report_${TS}.json"
          cp jira_report.json "reports/jira_report_latest.json"

          # Configure Git and commit only if there are changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json

          # If nothing to commit for 'latest', the new timestamped file still creates a new commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Jira report: ${TS}"
            git push
          fi

      # --- Optional: send formatted JSON to Teams (this stays, separate from Power Automate) ---
      - name: Prepare pretty JSON for Teams text block
        run: |
          jq '.' jira_report.json > pretty.json
          jq -n --rawfile body pretty.json \
            '{text: ("```\n" + $body + "\n```")}' > payload.json

      - name: Send to Microsoft Teams
        if: ${{ secrets.TEAMS_WEBHOOK_URL != '' }}
        run: |
          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
