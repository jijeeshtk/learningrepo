name: Bug Resolved Report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days.py

      - name: Normalize JSON (null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      - name: Commit JSON for audit
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json reports/jira_report_${TS}.json
          cp jira_report.json reports/jira_report_latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json
          git commit -m "Jira report updated ${TS}" || true
          git push || true

      - name: Send issues to Teams in batches of 15 (pretty JSON + code block)
        if: env.TEAMS_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "Webhook not set; skipping Teams."
            exit 0
          fi

          jq '.issues' jira_report.json > /tmp/issues.json
          TOTAL=$(jq 'length' /tmp/issues.json)
          BATCH_SIZE=15
          TOTAL_BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))

          echo "Total issues: $TOTAL"
          echo "Batch size  : $BATCH_SIZE"
          echo "Batches     : $TOTAL_BATCHES"

          index=0
          batch=1

          while [ "$index" -lt "$TOTAL" ]; do

            end=$(( index + BATCH_SIZE ))
            if [ "$end" -gt "$TOTAL" ]; then end="$TOTAL"; fi

            echo "Preparing Batch $batch/$TOTAL_BATCHES (items $((index+1))..$end)"

            # Slice issues → tmp/issues_batch.json
            jq ".[$index:$end]" /tmp/issues.json > /tmp/issues_batch.json

            # Build exact structure { "issues": [...] }
            jq -n --slurpfile s /tmp/issues_batch.json '{ issues: $s[0] }' > /tmp/batch.json

            # Pretty print EXACTLY like your single working version
            jq '.' /tmp/batch.json > /tmp/pretty.json

            # Build Teams payload → header + code block + pretty JSON
            jq -n \
              --arg header "Batch $batch/$TOTAL_BATCHES (items $((index+1))..$end)" \
              --rawfile body /tmp/pretty.json \
              '{ text: ($header + "\n```json\n" + $body + "\n```") }' \
              > /tmp/payload.json

            echo "Sending Batch $batch..."
            curl -sS -H "Content-Type: application/json" \
                 -d @/tmp/payload.json \
                 "$TEAMS_WEBHOOK_URL"

            # Small delay helps Teams process sequential messages
            sleep 2

            index=$end
            batch=$(( batch + 1 ))
          done

          echo "All batches sent successfully."
