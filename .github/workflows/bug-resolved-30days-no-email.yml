name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual trigger

jobs:
  jira-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Notify Teams (Minimal — For Power Automate Trigger)
        shell: bash
        run: |
          COUNT=$(jq '.issues | length' jira_report.json)
          MESSAGE="New bug report generated with $COUNT issues. Artifact available in GitHub Actions run: $GITHUB_RUN_ID"

          curl -H "Content-Type: application/json" \
               -d "{\"text\": \"${MESSAGE}\"}" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
