name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # Python setup
      # ----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      # ----------------------------------------
      # Run your Jira script
      # ----------------------------------------
      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      # ----------------------------------------
      # Upload artifact (optional)
      # ----------------------------------------
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      # ----------------------------------------
      # Fix invalid JSON (null → "")
      # ----------------------------------------
      - name: Fix invalid JSON (convert null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      # ----------------------------------------
      # Commit JSON into reports/ for auditing
      # ----------------------------------------
      - name: Commit JSON into /reports (timestamp + latest)
        env:
          TZ: UTC
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json "reports/jira_report_${TS}.json"
          cp jira_report.json "reports/jira_report_latest.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json

          git commit -m "Jira report: ${TS}" || echo "No changes to commit"
          git push || echo "No changes pushed"

      # ----------------------------------------
      # SEND ISSUES TO TEAMS IN BATCHES OF 20
      # JSON FORMAT FULLY PRESERVED
      # ----------------------------------------
      - name: Send issues to Teams in batches (RAW JSON preserved)
        if: env.TEAMS_WEBHOOK_URL != ''
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL not set; skipping Teams send."
            exit 0
          fi

          echo "Extracting issues array..."
          jq '.issues' jira_report.json > issues.json

          ISSUE_COUNT=$(jq 'length' issues.json)
          echo "Total issues: $ISSUE_COUNT"

          BATCH_SIZE=20
          TOTAL_BATCHES=$(( (ISSUE_COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "Total batches: $TOTAL_BATCHES"

          for ((i=0; i<ISSUE_COUNT; i+=BATCH_SIZE)); do
            START=$i
            END=$((i + BATCH_SIZE))
            BATCH_NUMBER=$(( (i / BATCH_SIZE) + 1 ))

            echo "Preparing batch $BATCH_NUMBER of $TOTAL_BATCHES"

            # Extract issues slice
            jq ".[$START:$END]" issues.json > issues_batch.json

            # Build EXACT JSON:
            # { "issues": [...] }
            jq -n \
              --slurpfile items issues_batch.json \
              '{ issues: $items[0] }' > final_batch.json

            # Load raw JSON (unescaped)
            RAW_JSON=$(cat final_batch.json)

            # Wrap JSON in Teams code block to prevent escaping
            cat <<EOF > teams_payload.json
{
  "text": "Batch $BATCH_NUMBER/$TOTAL_BATCHES\n\`\`\`json
$RAW_JSON
\`\`\`"
}
EOF

            echo "Sending batch $BATCH_NUMBER to Teams..."

            curl -H "Content-Type: application/json" \
                 -d @teams_payload.json \
                 "$TEAMS_WEBHOOK_URL"

          done

          echo "All issue batches sent to Teams successfully!"
