name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  jira-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Fix invalid or missing JSON fields
        run: |
          # Convert all null or missing values to ""
          jq 'walk(
                if type == "object"
                then with_entries(.value |= (if . == null then "" else . end))
                else .
                end
              )' jira_report.json > fixed.json

          mv fixed.json jira_report.json

      - name: Prepare JSON for Teams
        run: |
          # Pretty-print for Teams text card
          SAFE_JSON=$(jq '.' jira_report.json)

          # Construct simple Teams message
          PAYLOAD=$(jq -n --arg text "$SAFE_JSON" '{text: $text}')

          echo "$PAYLOAD" > payload.json

      - name: Send to Microsoft Teams
        run: |
          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
