name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  jira-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Fix invalid JSON (convert null → "")
        run: |
          # Replace all nulls anywhere in the document with empty strings.
          # Uses the recursive descent operator (..) so we don't need walk().
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      - name: Prepare pretty JSON for Teams text block
        run: |
          # Pretty print the JSON to a separate file
          jq '.' jira_report.json > pretty.json

          # Build Teams payload IN jq to avoid YAML/backtick quoting issues
          jq -n --rawfile body pretty.json \
            '{text: ("```\n" + $body + "\n```")}' > payload.json

      - name: Send to Microsoft Teams
        run: |
          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
