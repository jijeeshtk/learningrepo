name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  jira-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Send pretty JSON to Teams as plain code block
        shell: bash
        run: |
          # Fix invalid JSON
          sed -i 's/":,/"":/g' jira_report.json

          # Validate JSON
          if ! jq empty jira_report.json 2>/dev/null; then
            SAFE_JSON='{"error":"Invalid JSON"}'
          else
            SAFE_JSON=$(jq '.' jira_report.json)
          fi

          # Wrap in code block
          WRAPPED="```json
$SAFE_JSON
```"

          # Fallback if too large
          if [ $(echo -n "$WRAPPED" | wc -c) -gt 25000 ]; then
            SAFE_JSON=$(jq -c '.' jira_report.json)
            WRAPPED="$SAFE_JSON"
          fi

          PAYLOAD=$(jq -n --arg text "$WRAPPED" '{text: $text}')

          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
