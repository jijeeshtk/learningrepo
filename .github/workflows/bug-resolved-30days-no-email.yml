name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  jira-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests jq

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report
          path: jira_report.json

      - name: Send pretty JSON to Teams as code block (fallback to minified if large)
        shell: bash
        run: |
          PRETTY=$(jq '.' jira_report.json)
          WRAPPED="```json
$PRETTY
```"
          PAYLOAD=$(jq -n --arg text "$WRAPPED" '{text: $text}')
          if [ $(echo -n "$WRAPPED" | wc -c) -gt 25000 ]; then
            echo "Pretty JSON too large; falling back to minified."
            MINIFIED=$(jq -c '.' jira_report.json)
            PAYLOAD=$(jq -n --arg text "$MINIFIED" '{text: $text}')
          fi
          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
