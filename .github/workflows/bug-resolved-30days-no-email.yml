name: Bug resolved report

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  jira-report:
    runs-on: ubuntu-latest

    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install requests

      - name: Run Jira report script
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python bug-resolved-30days-no-email.py

      - name: Normalize JSON (null → "")
        run: |
          jq '(.. | select(. == null)) |= ""' jira_report.json > fixed.json
          mv fixed.json jira_report.json

      - name: Commit JSON for audit
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports
          cp jira_report.json reports/jira_report_${TS}.json
          cp jira_report.json reports/jira_report_latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/jira_report_${TS}.json reports/jira_report_latest.json
          git commit -m "Jira report updated ${TS}" || true
          git push || true

      - name: Send issues to Teams (with warm-up fix)
        if: env.TEAMS_WEBHOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "Webhook not set; skipping."
            exit 0
          fi

          # Load issues
          jq '.issues' jira_report.json > /tmp/issues.json
          TOTAL=$(jq 'length' /tmp/issues.json)
          BATCH_SIZE=20
          TOTAL_BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))

          echo "Total issues: $TOTAL"
          echo "Sending in $TOTAL_BATCHES batch(es)"

          # ------------------------------
          # 🔥 WARM-UP FIX FOR TEAMS BUG
          # ------------------------------
          echo '{"text":"Initializing Jira report delivery..."}' > /tmp/ping.json
          curl -sS -H "Content-Type: application/json" -d @/tmp/ping.json "$TEAMS_WEBHOOK_URL"
          sleep 5     # ⭐ WAIT BEFORE SENDING BATCH 1

          # ------------------------------
          # SEND BATCHES
          # ------------------------------
          index=0
          batch=1

          while [ "$index" -lt "$TOTAL" ]; do
            end=$(( index + BATCH_SIZE ))
            if [ "$end" -gt "$TOTAL" ]; then end="$TOTAL"; fi

            jq ".[$index:$end]" /tmp/issues.json > /tmp/slice.json
            jq -n --slurpfile s /tmp/slice.json '{ issues: $s[0] }' > /tmp/batch.json
            jq '.' /tmp/batch.json > /tmp/pretty.json   # pretty-print like your old working one

            jq -n \
              --arg header "Batch $batch/$TOTAL_BATCHES (items $((index+1))..$end)" \
              --rawfile body /tmp/pretty.json \
              '{ text: ($header + "\n```json\n" + $body + "\n```") }' \
              > /tmp/payload.json

            echo "Sending Batch $batch/$TOTAL_BATCHES"
            curl -sS -H "Content-Type: application/json" -d @/tmp/payload.json "$TEAMS_WEBHOOK_URL"

            sleep 2   # avoid Teams double-message collision

            index=$end
            batch=$(( batch + 1 ))
          done

          echo "All batches sent."
