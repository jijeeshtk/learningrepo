name: Jira report (email via Google SMTP relay)

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade requests

      - name: Run report and email (Google relay)
        env:
          # --- Jira ---
          JIRA_URL: https://atos-global.atlassian.net
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_JQL: 'project = VCS AND type IN (Bug, Defect) AND updated >= -6h'

          # --- Email content ---
          SEND_EMAIL: 'true'
          MAIL_FROM: 'noreply@jiracloud.com'
          MAIL_TO: 'jijeesh.valappil@atos.net'
          MAIL_SUBJECT: '[Jira] Bug/Defect report (last 6h)'

          # --- Google SMTP relay settings ---
          SMTP_HOST: 'smtp-relay.gmail.com'
          SMTP_PORT: '587'
          SMTP_STARTTLS: 'true'

          # --- Authentication mode (recommended for GitHub-hosted runners) ---
          SMTP_REQUIRE_AUTH: 'true'
          SMTP_USER: ${{ secrets.GWSMTP_USER }}           # e.g., relay-svc@your-domain.tld
          SMTP_PASS: ${{ secrets.GWSMTP_APP_PASSWORD }}   # 16-char App Password

          # If using self-hosted/static-IP runner and Google IP-allowlist:
          # SMTP_REQUIRE_AUTH: 'false'
          # SMTP_USER: ''
          # SMTP_PASS: ''
        run: |
          python jira_report_email.py

      - name: Upload JSON artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: jira-report-json
          path: jira_report.json
