<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "url": "{{ .Permalink }}",
  "headline": "{{ .Title }}",
  "description": "{{ .Description }}",
  "wordCount": {{ .WordCount }},
  "datePublished": "{{ .Date.Format "2006-01-02" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
  "author": {
    "@type": "Person",
    "name": "{{ with .Params.author }}{{ . }}{{ else }}Unknown{{ end }}"
  }
}
</script>
