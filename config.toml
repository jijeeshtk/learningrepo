title = "Learning Repo Documentation"
baseURL = ""
relativeurls = true
uglyurls = true

DefaultContentLanguage = "en"
metaDataFormat = "yaml"
pygmentsUseClasses = true
pygmentCodeFences = true

theme = "aec-documentation"
disableSearch = true

# -------------------------------
# Hugo Module Mode
# Required because you mount folders as content sources
# -------------------------------
[module]

  # Load theme as a Hugo module (CRITICAL)
  [[module.imports]]
    path = "aec-documentation"

  # Mount your actual directories into Hugo's content tree
  [[module.mounts]]
    source = 'main'
    target = 'content'

  [[module.mounts]]
    source = 'design'
    target = 'content/design'

  [[module.mounts]]
    source = 'workInstructions'
    target = 'content/workinstructions'

  [[module.mounts]]
    source = 'design/images'
    target = 'static/images'

  [[module.mounts]]
    source = 'workInstructions/images'
    target = 'static/images'


# -------------------------------
# Site Params (Matches production)
# -------------------------------
[Params]
  subtitle = "Learning Repo Documentation"
  logo = "img/avatar-icon.png"
  favicon = "img/favicon.ico"
  dateFormat = "January 2, 2006"
  commit = false
  rss = true
  comments = true

# -------------------------------
# Markup (from production)
# -------------------------------
[markup]
  [markup.goldmark.extensions]
    definitionList = true
    footnote = false
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 1

# -------------------------------
# Author (not important but included)
# -------------------------------
[Author]
  name = "Learning Repo Dev"
