# For absolute URLs, uncomment the next line:
# baseURL = "https://jijeeshhomelab.github.io/learningrepo/"

title = "Homelab Documentation"
theme = "docsy"
relativeURLs = true
uglyURLs = true
DefaultContentLanguage = "en"

[module]
  [[module.mounts]]
    source = 'main'
    target = 'content'
  [[module.mounts]]
    source = 'design'
    target = 'content/design'
  [[module.mounts]]
    source = 'workInstructions'
    target = 'content/workinstructions'
  [[module.mounts]]
    source = 'design/images'
    target = 'static/images'
  [[module.mounts]]
    source = 'workInstructions/images'
    target = 'static/images'

  # Add Docsy + dependencies as Hugo modules
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/twbs/bootstrap"
  [[module.imports]]
    path = "github.com/FortAwesome/Font-Awesome"

[Params]
  # These are Geekdoc params; you may want to remove them later
  geekdocSearch = true
  geekdocToC = true
  geekdocCollapseAllSections = false

[Author]
  name = "homelab"
