title = "Learning Repo Documentation"
relativeurls = true
uglyurls = true

DefaultContentLanguage = "en"
metaDataFormat = "yaml"
pygmentsUseClasses = true
pygmentCodeFences = true

# THEME (loaded in classic mode)
theme = "aec-documentation"

disableSearch = true

[Params]
  subtitle = "Learning Repo DEV Documentation"
  logo = "img/avatar-icon.png"
  favicon = "img/favicon.ico"
  dateFormat = "January 2, 2006"
  commit = false
  rss = true
  comments = true

[markup]
  [markup.goldmark.extensions]
    definitionList = true
    footnote = false
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 1

[Author]
  name = "Learning Repo Dev"
