title = "Learning Repo Documentation"
relativeurls = true
uglyurls = true

DefaultContentLanguage = "en"
metaDataFormat = "yaml"
pygmentsUseClasses = true
pygmentCodeFences = true

disableSearch = true

# MOUNT CONTENT FOLDERS
[module]

  # Main content
  [[module.mounts]]
    source = 'main'
    target = 'content'

  # Design docs
  [[module.mounts]]
    source = 'design'
    target = 'content/design'

  # Work instructions
  [[module.mounts]]
    source = 'workInstructions'
    target = 'content/workinstructions'

  # Static image mounts
  [[module.mounts]]
    source = 'design/images'
    target = 'static/images'

  [[module.mounts]]
    source = 'workInstructions/images'
    target = 'static/images'

  # ✅ THEME IMPORT (VERY IMPORTANT)
  [[module.imports]]
    path = "aec-documentation"

# (Optional; ignored in module mode, but keeping it doesn't hurt)
theme = "aec-documentation"

[Params]
  subtitle = "Learning Repo DEV Documentation"
  logo = "img/avatar-icon.png"
  favicon = "img/favicon.ico"
  dateFormat = "January 2, 2006"
  commit = false
  rss = true
  comments = true

[markup]
  [markup.goldmark.extensions]
    definitionList = true
    footnote = false
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 1

[Author]
  name = "Learning Repo Dev"
